<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fafafa">
  <title>Manipulation Demos</title>
  <style>
    :root {
      --paper: #fafafa;
      --ink: #1d1d1f;
      --secondary: #6e6e73;
      --card: #fff;
      --stroke: #e8e8eb;
      --cardinal: #8c1515;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 70px 28px 100px;
    }
    .masthead {
      padding: 0 0 36px;
      border-bottom: 1px solid var(--stroke);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 17px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--secondary);
    }
    .eyebrow::before {
      content: "";
      display: block;
      width: 30px;
      height: 2px;
      background: var(--cardinal);
      border-radius: 2px;
    }
    h1 {
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 620;
      line-height: 1.08;
      letter-spacing: -.055em;
      margin: 0;
    }
    .intro {
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.4;
      color: var(--secondary);
      margin: 14px 0 0;
    }
    .group { margin-top: 46px; }
    .group-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 16px;
    }
    .group-title::before,
    .group-title::after {
      content: "";
      display: block;
      height: 1px;
      flex: 1 1 0;
      min-width: 12px;
    }
    .group-title::before {
      background: linear-gradient(to right, rgba(140,21,21,.18), var(--cardinal));
    }
    .group-title::after {
      background: linear-gradient(to left, rgba(140,21,21,.18), var(--cardinal));
    }
    .group-title h2 {
      text-align: center;
      flex: 0 1 auto;
    }
    h2 {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 615;
      letter-spacing: -.035em;
      line-height: 1.2;
      margin: 0;
    }
    .tile {
      margin: 0;
      padding: 12px 12px 15px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 21px;
      box-shadow: 0 4px 22px rgba(0,0,0,.035);
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
    }
    .tile:hover {
      transform: translateY(-2px);
      border-color: #dfcaca;
      box-shadow: 0 12px 28px rgba(0,0,0,.065);
    }
    .media {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f7f7f8, #ededf0);
      color: #a1a1a6;
      border: 1px solid rgba(0,0,0,.035);
    }
    .placeholder { text-align: center; font-size: 12px; }
    .play {
      display: grid;
      place-items: center;
      border: 1px solid #dcdce0;
      width: 46px;
      height: 46px;
      margin: 0 auto 9px;
      border-radius: 50%;
      font-size: 17px;
      color: #74747a;
      padding-left: 3px;
      background: rgba(255,255,255,.82);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #111;
    }
    figcaption {
      color: var(--secondary);
      padding: 12px 4px 0;
      font-size: 13px;
      line-height: 1.45;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }
    footer {
      margin-top: 57px;
      padding-top: 20px;
      border-top: 1px solid var(--stroke);
      color: #a1a1a6;
      font-size: 12px;
      text-align: center;
    }
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity .65s ease, transform .65s cubic-bezier(.22,.7,.2,1);
      }
      .reveal.is-visible { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 700px) {
      main { padding: 42px 16px 60px; }
      .group { margin-top: 34px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .tile { border-radius: 16px; padding: 8px 8px 12px; }
      .media { border-radius: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .tile { transition: none; }
    }
  </style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">Demo preview</div>
    <h1>Manipulation demos</h1>
    <p class="intro">Teleoperation, object pickup, and data collection.</p>
  </header>

  <section class="group reveal" aria-labelledby="live-title">
    <div class="group-title"><h2 id="live-title">Live glove-guided control</h2></div>
    <figure class="tile">
      <div class="media" id="glove"><div class="placeholder"><span class="play" aria-hidden="true">▶</span>Video coming soon</div></div>
      <figcaption>Real-time manipulation guided by human glove input.</figcaption>
    </figure>
  </section>

  <section class="group reveal" aria-labelledby="pickup-title">
    <div class="group-title"><h2 id="pickup-title">Object pickup</h2></div>
    <div class="grid">
      <figure class="tile">
        <div class="media" id="pickup1"><div class="placeholder"><span class="play" aria-hidden="true">▶</span>Video coming soon</div></div>
        <figcaption>3D-printed object · 01</figcaption>
      </figure>
      <figure class="tile">
        <div class="media" id="pickup2"><div class="placeholder"><span class="play" aria-hidden="true">▶</span>Video coming soon</div></div>
        <figcaption>3D-printed object · 02</figcaption>
      </figure>
      <figure class="tile">
        <div class="media" id="pickup3"><div class="placeholder"><span class="play" aria-hidden="true">▶</span>Video coming soon</div></div>
        <figcaption>3D-printed object · 03</figcaption>
      </figure>
    </div>
  </section>

  <section class="group reveal" aria-labelledby="data-title">
    <div class="group-title"><h2 id="data-title">Data collection setup</h2></div>
    <figure class="tile">
      <div class="media" id="collection"><div class="placeholder"><span class="play" aria-hidden="true">▶</span>Video coming soon</div></div>
      <figcaption>Recording human hand–object interactions.</figcaption>
    </figure>
  </section>

  <footer>Demo preview</footer>
</main>
<!-- Reserved video paths, to be wired up after reviewing footage:
  videos/glove.mp4
  videos/pickup1.mp4
  videos/pickup2.mp4
  videos/pickup3.mp4
  videos/collection.mp4
-->
<script>
  const panels = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    const observer = new IntersectionObserver(entries => {
      for (const item of entries) {
        if (item.isIntersecting) {
          item.target.classList.add('is-visible');
          observer.unobserve(item.target);
        }
      }
    }, {threshold: 0.06});
    panels.forEach(panel => observer.observe(panel));
  } else {
    panels.forEach(panel => panel.classList.add('is-visible'));
  }
</script>
</body>
</html>
